services:
  # ─── Backend API (FastAPI) ─────────────────────────────────
  - type: web
    name: novara-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_BACKUP
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free

  # ─── Frontend Web App (React / Vite Static Site) ────────────
  - type: web
    name: novara-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://novara-api-dnhc.onrender.com
      - key: VITE_API_KEY
        value: fXTFEdbxbsOE9fuU8E-xbYiwOEyRzgZBzJcwA_DaJ9c
