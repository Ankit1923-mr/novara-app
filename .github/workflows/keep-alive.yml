name: Keep Render backend alive

on:
  schedule:
    # Every 10 minutes — under Render free tier's 15-minute idle spin-down.
    # GitHub may delay scheduled runs slightly under load; 10 min leaves margin.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://novara-api-dnhc.onrender.com/)
          echo "Health check response: $response"
          if [ "$response" != "200" ]; then
            echo "Backend did not respond with 200"
            exit 1
          fi
